<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" style="background:#0a0a0a">
  <text x="300" y="25" text-anchor="middle" fill="#10B981" font-family="monospace" font-size="16" font-weight="bold">Data Preprocessing Pipeline</text>
  
  <!-- Input -->
  <rect x="20" y="70" width="100" height="60" rx="5" fill="#1f2937" stroke="#6b7280" stroke-width="2"/>
  <text x="70" y="95" text-anchor="middle" fill="#f3f4f6" font-family="monospace" font-size="10">Raw Data</text>
  <text x="70" y="115" text-anchor="middle" fill="#9ca3af" font-family="monospace" font-size="8">Missing Values</text>
  
  <!-- Arrow 1 -->
  <line x1="120" y1="100" x2="150" y2="100" stroke="#4b5563" stroke-width="2"/>
  <polygon points="150,100 145,95 145,105" fill="#4b5563"/>
  
  <!-- Imputer -->
  <rect x="150" y="70" width="100" height="60" rx="5" fill="#1f2937" stroke="#f59e0b" stroke-width="2"/>
  <text x="200" y="95" text-anchor="middle" fill="#f3f4f6" font-family="monospace" font-size="10">Imputer</text>
  <text x="200" y="115" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="8">Fill Missing</text>
  
  <!-- Arrow 2 -->
  <line x1="250" y1="100" x2="280" y2="100" stroke="#4b5563" stroke-width="2"/>
  <polygon points="280,100 275,95 275,105" fill="#4b5563"/>
  
  <!-- Scaler -->
  <rect x="280" y="70" width="100" height="60" rx="5" fill="#1f2937" stroke="#3b82f6" stroke-width="2"/>
  <text x="330" y="95" text-anchor="middle" fill="#f3f4f6" font-family="monospace" font-size="10">Scaler</text>
  <text x="330" y="115" text-anchor="middle" fill="#60a5fa" font-family="monospace" font-size="8">Standardize</text>
  
  <!-- Arrow 3 -->
  <line x1="380" y1="100" x2="410" y2="100" stroke="#4b5563" stroke-width="2"/>
  <polygon points="410,100 405,95 405,105" fill="#4b5563"/>
  
  <!-- Encoder -->
  <rect x="410" y="70" width="100" height="60" rx="5" fill="#1f2937" stroke="#8b5cf6" stroke-width="2"/>
  <text x="460" y="95" text-anchor="middle" fill="#f3f4f6" font-family="monospace" font-size="10">Encoder</text>
  <text x="460" y="115" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="8">One-Hot</text>
  
  <!-- Arrow 4 -->
  <line x1="510" y1="100" x2="540" y2="100" stroke="#4b5563" stroke-width="2"/>
  <polygon points="540,100 535,95 535,105" fill="#4b5563"/>
  
  <!-- Output -->
  <rect x="540" y="70" width="50" height="60" rx="5" fill="#064e3b" stroke="#10B981" stroke-width="2"/>
  <text x="565" y="105" text-anchor="middle" fill="#10B981" font-family="monospace" font-size="10">✓ Ready</text>
</svg>
